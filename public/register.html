<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0F172A">
    <title>Create account · EmeNoxr</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="/styles/main.css">
    <style>
      .auth-page {
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px 16px;
      }
      .auth-wrap { width: 100%; max-width: 420px; display: grid; gap: 20px; }
      .auth-brand { display: flex; align-items: center; justify-content: center; gap: 12px; }
      .auth-card { padding: 28px; box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35); }
      .auth-card h1 { margin: 0 0 4px; font-size: 22px; font-weight: 700; letter-spacing: -0.01em; }
      .auth-subtitle { margin: 0 0 8px; color: var(--text-muted); font-size: 13px; }
      .auth-form { margin-top: 8px; }
      .auth-form button[type="submit"] { width: 100%; margin-top: 16px; min-height: 48px; font-size: 15px; }
      .field-hint { margin: 0; color: var(--text-muted); font-size: 12px; }
      .optional { color: var(--text-muted); font-weight: 400; }
      .error {
        margin: 12px 0 0;
        padding: 10px 12px;
        border: 1px solid rgba(239, 68, 68, 0.5);
        border-radius: var(--radius-btn);
        background: rgba(239, 68, 68, 0.12);
        color: #FECACA;
        font-size: 13px;
      }
      .error:empty { display: none; }
      .auth-switch { margin: 20px 0 0; text-align: center; color: var(--text-muted); font-size: 13px; }
      .auth-switch a { color: var(--color-teal-light); font-weight: 600; text-decoration: none; }
      .auth-switch a:hover { text-decoration: underline; }
      .auth-footnote { margin: 0; text-align: center; color: var(--text-muted); font-size: 12px; }
    </style>
    <script type="module" src="/scripts/auth.js"></script>
  </head>
  <body>
    <main class="auth-page">
      <div class="auth-wrap">
        <div class="auth-brand">
          <span class="brand-dot" aria-hidden="true"></span>
          <span class="brand-name">EmeNoxr</span>
        </div>

        <section class="dashboard-card auth-card" aria-labelledby="register-heading">
          <h1 id="register-heading">Create your account</h1>
          <p class="auth-subtitle">Set up monitoring for your household.</p>

          <form id="register-form" class="settings auth-form" novalidate>
            <label for="fullName">Full name <span class="optional">(optional)</span></label>
            <input id="fullName" name="fullName" type="text" autocomplete="name" maxlength="100">

            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="username"
                   inputmode="email" maxlength="254" required>

            <label for="password">Password</label>
            <input id="password" name="password" type="password"
                   autocomplete="new-password" minlength="12" maxlength="128"
                   aria-describedby="password-hint" required>
            <p id="password-hint" class="field-hint">Use at least 12 characters. A short phrase of several words works well.</p>

            <div id="error-message" class="error" role="alert" aria-live="assertive"></div>

            <button id="submit-button" type="submit">Create account</button>
          </form>

          <p class="auth-switch">Already have an account? <a href="/login.html">Sign in</a></p>
        </section>

        <p class="auth-footnote">Prototype only. Not a medical device or a substitute for emergency services.</p>
      </div>
    </main>
  </body>
</html>
